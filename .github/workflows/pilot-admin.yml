name: CardVault pilot admin checks
on:
  push:
    branches: [pilot-admin-mobile, pilot-admin-auth-diagnostics]
    paths:
      - 'pilot-backend/src/**'
      - 'tests/pilot-admin-smoke.mjs'
      - 'tests/pilot-admin-auth.mjs'
      - '.github/workflows/pilot-admin.yml'
  pull_request:
    paths:
      - 'pilot-backend/src/**'
      - 'tests/pilot-admin-smoke.mjs'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check pilot-backend/src/index.js
      - run: node tests/pilot-admin-smoke.mjs
      - run: node tests/pilot-admin-auth.mjs
