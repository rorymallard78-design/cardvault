name: Update CardVault Release Calendar
on:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cardvault-calendar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python tools/update_releases.py
      - name: Commit verified changes only
        run: |
          if ! git diff --quiet -- beta/cv-releases.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add beta/cv-releases.json
            git commit -m "Update verified trading card releases"
            git push
          fi
